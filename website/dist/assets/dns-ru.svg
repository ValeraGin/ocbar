<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Split DNS: имя сначала, соединение потом</title><desc id="desc">Пример. Имя portal.example.com запрашивается у корпоративного DNS, который возвращает рабочий адрес 10.20.8.12. Трафик к этому адресу идёт через ocbar. Внешнее имя example.org разрешается обычным резолвером. Пунктир обозначает DNS, сплошная линия — трафик.</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#2D3D31}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.muted{fill:#7C887D}</style></defs>
<rect width="1000" height="390" rx="20" fill="#F2F4ED"/>
<text x="35" y="41" font-size="11" letter-spacing="1.5" class="muted">ПРИМЕР / ДВА РАЗНЫХ ВОПРОСА</text>
<text x="40" y="104" font-size="13" font-weight="600">Какой адрес у имени?</text><text x="40" y="126" font-size="11" class="muted">DNS-запрос</text>
<rect x="261" y="77" width="195" height="65" rx="8" fill="#FFF" stroke="#D2DBCD"/><text x="359" y="115" text-anchor="middle" font-size="14" class="mono">portal.example.com</text>
<path d="M456 109H536" stroke="#4E7856" stroke-width="2" stroke-dasharray="4 6"/><path d="M529 105L537 109L529 113" stroke="#4E7856" stroke-width="1.5"/>
<rect x="543" y="77" width="181" height="65" rx="8" fill="#DFEAD8" stroke="#B8CCB0"/><text x="633" y="104" text-anchor="middle" font-size="13" font-weight="600">Корпоративный DNS</text><text x="633" y="124" text-anchor="middle" font-size="11" class="muted">для рабочей зоны</text>
<path d="M724 109H802" stroke="#4E7856" stroke-width="2" stroke-dasharray="4 6"/><path d="M795 105L803 109L795 113" stroke="#4E7856" stroke-width="1.5"/>
<text x="825" y="105" font-size="11" class="muted">Рабочий IP</text><text x="825" y="126" font-size="15" class="mono">10.20.8.12</text>
<rect x="261" y="161" width="195" height="50" rx="8" fill="#FFF" stroke="#D2DBCD"/><text x="359" y="190" text-anchor="middle" font-size="13" class="mono">example.org</text>
<path d="M456 186H536" stroke="#919B8F" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="543" y="161" width="181" height="50" rx="8" fill="#EAEEE5" stroke="#D2DBCD"/><text x="633" y="190" text-anchor="middle" font-size="13">Обычный резолвер</text>
<path d="M724 186H803" stroke="#919B8F" stroke-width="2" stroke-dasharray="4 6"/><text x="825" y="190" font-size="13" class="muted">Внешний адрес</text>
<path d="M35 242H965" stroke="#D9E0D2"/>
<text x="40" y="289" font-size="13" font-weight="600">Куда отправить трафик?</text><text x="40" y="311" font-size="11" class="muted">Маршрут к полученному IP</text>
<rect x="261" y="272" width="151" height="58" rx="8" fill="#FFF" stroke="#D2DBCD"/><text x="337" y="306" text-anchor="middle" font-size="15" class="mono">10.20.8.12</text>
<path d="M412 301H538" stroke="#4E7856" stroke-width="3"/><path d="M529 296L538 301L529 306" stroke="#4E7856" stroke-width="2"/>
<rect x="543" y="272" width="181" height="58" rx="8" fill="#34583D"/><text x="633" y="307" text-anchor="middle" font-size="18" font-weight="600" style="fill:white">ocbar</text>
<path d="M724 301H803" stroke="#4E7856" stroke-width="3"/><path d="M795 296L804 301L795 306" stroke="#4E7856" stroke-width="2"/>
<text x="825" y="306" font-size="13">Рабочий портал</text>
<path d="M41 361H69" stroke="#4E7856" stroke-width="2" stroke-dasharray="4 6"/><text x="78" y="365" font-size="10" class="muted">Запрос имени</text><path d="M233 361H261" stroke="#4E7856" stroke-width="3"/><text x="270" y="365" font-size="10" class="muted">Трафик к адресу</text>
</svg>
