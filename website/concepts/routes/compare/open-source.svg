 <text x="450" y="107" class="code" style="fill:#96a08f">01</text><text x="481" y="107" class="code">// Посмотреть, как всё устроено</text><text x="450" y="135" class="code" style="fill:#96a08f">02</text><text x="481" y="135" class="code" style="fill:#248168">routes → network destinations</text><text x="450" y="163" class="code" style="fill:#96a08f">03</text><text x="481" y="163" class="code">dns → resolver selection</text><text x="450" y="191" class="code" style="fill:#96a08f">04</text><text x="481" y="191" class="code">logs → connection details</text><text x="450" y="219" class="code" style="fill:#96a08f">05</text><text x="481" y="219" class="code" style="fill:#248168">license → MIT</text>
