  <rect x="780" y="685" width="270" height="64" rx="12" fill="#e4f1e9" stroke="#c9dfd0"/><text x="915" y="710" text-anchor="middle" class="label">ocbar → рабочая сеть</text><text x="915" y="731" text-anchor="middle" class="small muted">10.20.0.0/16</text>
  <rect x="1090" y="685" width="224" height="64" rx="12" fill="#e4eff5" stroke="#c9dee9"/><text x="1202" y="710" text-anchor="middle" class="label">Напрямую по LAN</text><text x="1202" y="731" text-anchor="middle" class="small muted">192.168.50.20</text>
  <text x="465" y="780" class="small muted">Иллюстрация с демо-данными. Цвет обозначает маршрут к адресу назначения.</text>
</svg>
