    <g fill="#75b8d4"><path d="M800 531h10l4 4h15v15h-29z"/><path d="M800 560h10l4 4h15v15h-29z"/><path d="M800 589h10l4 4h15v15h-29z"/></g>
    <text x="839" y="546" font-size="11">Фотографии</text><text x="839" y="575" font-size="11">Семейный архив</text><text x="839" y="604" font-size="11">Резервные копии</text><text x="1024" y="546" font-size="10" class="muted">Сегодня</text><text x="1024" y="575" font-size="10" class="muted">Вчера</text><text x="1024" y="604" font-size="10" class="muted">Вчера</text>
  </g>
