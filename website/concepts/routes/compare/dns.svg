<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc">
 <title id="title">Split DNS: сначала имя, затем маршрут</title><desc id="desc">Запрос portal.example.com идёт к корпоративному DNS, который возвращает 10.20.4.12. Затем трафик к этому адресу идёт через ocbar. Запрос внешнего имени идёт к обычному резолверу. Пунктир обозначает DNS, сплошная линия — трафик.</desc>
 <defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1d3033}.head{font-size:18px;font-weight:650}.small{font-size:13px;fill:#627175}.line{fill:none;stroke:#258569;stroke-width:2.5;stroke-dasharray:5 7;stroke-linecap:round}</style></defs>
 <rect width="1100" height="350" rx="18" fill="#f1f4ef"/>
 <text x="30" y="42" class="small">ПРИМЕР · РАЗРЕШЕНИЕ ИМЕНИ</text>
 <rect x="30" y="83" width="252" height="94" rx="10" fill="white"/><text x="48" y="118" class="head">portal.example.com</text><text x="48" y="147" class="small">Запрос: «Какой IP?»</text>
 <path d="M282 129h88" class="line"/><path d="M362 123l8 6-8 6" fill="none" stroke="#258569" stroke-width="2"/>
 <rect x="370" y="83" width="248" height="94" rx="10" fill="#e0eee4"/><text x="390" y="118" class="head">Корпоративный DNS</text><text x="390" y="147" class="small">Ответ: 10.20.4.12</text>
 <path d="M618 129h80" class="line"/><path d="M690 123l8 6-8 6" fill="none" stroke="#258569" stroke-width="2"/>
 <rect x="698" y="83" width="370" height="94" rx="10" fill="white"/><text x="718" y="118" class="head">Адрес известен → ocbar</text><text x="718" y="147" class="small">10.20.4.12 входит в 10.20.0.0/16</text>
 <path d="M737 196h73" stroke="#258569" stroke-width="3"/><text x="824" y="201" class="small">Трафик к рабочей сети</text>
 <rect x="30" y="224" width="252" height="68" rx="10" fill="white"/><text x="48" y="250" class="head">www.example.net</text><text x="48" y="275" class="small">Внешнее имя</text><path d="M282 258h88" class="line" stroke="#819093"/><path d="M362 252l8 6-8 6" fill="none" stroke="#819093" stroke-width="2"/>
 <rect x="370" y="224" width="248" height="68" rx="10" fill="#e8ecec"/><text x="390" y="264" class="head">Обычный резолвер</text><text x="698" y="252" class="small">DNS отвечает за имя.</text><text x="698" y="277" class="small">Маршрут отвечает за доставку трафика.</text>
 <path d="M30 324h36" class="line"/><text x="78" y="329" class="small">DNS-запрос / ответ</text><path d="M286 324h36" stroke="#258569" stroke-width="3"/><text x="334" y="329" class="small">Трафик</text>
</svg>
