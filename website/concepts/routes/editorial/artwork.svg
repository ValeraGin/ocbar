<title id="title">Один Mac. Три маршрута.</title><desc id="desc">Пример: окно YouTube получает трафик через сторонний личный VPN. Рабочий портал portal.example.com в сети 10.20.0.0/16 — через собственную сессию ocbar. Finder с домашним NAS 192.168.50.20 — напрямую по LAN. Маршрут выбирается по адресу назначения, не по приложению.</desc>
