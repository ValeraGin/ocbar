<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" role="img" aria-labelledby="title desc">
<title id="title">Split DNS: сначала запрос имени, затем трафик</title><desc id="desc">Запрос portal.example.com идёт к корпоративному DNS и возвращает рабочий адрес 10.20.1.8. Запрос example.org идёт к обычному резолверу. После разрешения рабочего имени трафик к 10.20.1.8 передаётся по маршруту через ocbar.</desc>
<defs><marker id="name" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#ad762e" stroke-width="2"/></marker><marker id="data" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#188358" stroke-width="2"/></marker><filter id="shadow"><feDropShadow dy="6" stdDeviation="8" flood-color="#213a28" flood-opacity=".07"/></filter></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#253d30}.small{font-size:11px;fill:#6a7a6f}.mono{font-family:ui-monospace,monospace;font-size:14px}.name{stroke:#ad762e;stroke-width:2;fill:none;stroke-dasharray:5 5;marker-end:url(#name)}.data{stroke:#188358;stroke-width:3;fill:none;marker-end:url(#data)}</style>
<rect x="15" y="18" width="650" height="273" rx="13" fill="#fafbf8" stroke="#d8e2d2" filter="url(#shadow)"/>
<circle cx="38" cy="41" r="4" fill="#d3dbc9"/><circle cx="52" cy="41" r="4" fill="#d3dbc9"/><circle cx="66" cy="41" r="4" fill="#d3dbc9"/><text x="274" y="46" font-size="11" fill="#6a7a6f">01 / Найти адрес</text><path d="M15 61h650" stroke="#e1e8dc"/>
<text x="43" y="97" font-size="10" letter-spacing="1" fill="#6a7a6f">ИМЯ</text><text x="396" y="97" font-size="10" letter-spacing="1" fill="#6a7a6f">КУДА УХОДИТ ЗАПРОС</text>
<rect x="34" y="116" width="250" height="42" rx="7" fill="#eff3e9"/><text x="49" y="142" class="mono">portal.example.com</text><path d="M296 137h76" class="name"/>
<rect x="388" y="116" width="249" height="42" rx="7" fill="#f2eee3"/><text x="404" y="142" font-size="14">Корпоративный DNS</text>
<path d="M514 158v22h-65" class="name"/><text x="388" y="200" font-size="11" fill="#188358">Ответ: 10.20.1.8</text>
<path d="M34 215h603" stroke="#e1e8dc"/>
<text x="49" y="251" class="mono">example.org</text><path d="M296 246h76" class="name"/><text x="404" y="251" font-size="14">Обычный резолвер</text>
<text x="35" y="328" font-size="11" fill="#6a7a6f">02 / Передать данные по найденному адресу</text>
<rect x="32" y="351" width="144" height="64" rx="10" fill="#fff" stroke="#d8e2d2"/><text x="51" y="377" class="small">РАБОЧИЙ IP</text><text x="51" y="399" class="mono">10.20.1.8</text><path d="M188 383h78" class="data"/>
<rect x="281" y="351" width="128" height="64" rx="10" fill="#dcebd9" stroke="#9bbe94"/><text x="315" y="390" font-size="19" font-weight="600" fill="#188358">ocbar</text><path d="M421 383h54" class="data"/>
<rect x="490" y="351" width="145" height="64" rx="10" fill="#fff" stroke="#d8e2d2"/><text x="513" y="377" font-size="12">Рабочая сеть</text><text x="513" y="399" class="small">10.20.0.0/16</text>
<text x="35" y="447" font-size="10" fill="#6a7a6f">Пунктир = запрос имени. Сплошная линия = трафик к адресу.</text>
</svg>
