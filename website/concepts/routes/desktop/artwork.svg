<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Один Mac. Три маршрута.</title><desc id="desc">Иллюстрация рабочего стола macOS: YouTube через сторонний личный VPN, рабочий портал 10.20.0.0/16 через ocbar, Finder с NAS 192.168.50.20 напрямую по LAN. Цветные линии обозначают маршруты к адресам назначения, а не привязку приложений к VPN.</desc>
