  <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#213528" flood-opacity=".10"/></filter>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#406C4B"/><stop offset="1" stop-color="#274833"/></linearGradient>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#29372D}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.muted{fill:#7C887D}.label{font-size:11px;letter-spacing:1.5px}.body{font-size:13px}.small{font-size:11px}.heading{font-size:17px;font-weight:600}.route-personal,.route-work,.route-lan{transition:opacity .2s}svg[data-focus="personal"] .route-work,svg[data-focus="personal"] .route-lan,svg[data-focus="work"] .route-personal,svg[data-focus="work"] .route-lan,svg[data-focus="lan"] .route-personal,svg[data-focus="lan"] .route-work{opacity:.18}@media(prefers-reduced-motion:reduce){.route-personal,.route-work,.route-lan{transition:none}}</style>
</defs>
