<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Атлас маршрутов одного Mac</title>
<desc id="desc">Иллюстрация с демо-данными. YouTube открыт через сторонний личный VPN. Рабочий портал portal.example.com и сеть 10.20.0.0/16 доступны через ocbar. Папки NAS 192.168.50.20 доступны напрямую по LAN. Маршрут выбирается по адресу назначения, а не по приложению.</desc>
<defs>
