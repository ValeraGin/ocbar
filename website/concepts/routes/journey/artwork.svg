<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="title desc">
<title id="title">Один Mac. Три пути запроса.</title><desc id="desc">Пример: YouTube идёт через отдельно настроенный личный VPN, портал с адресом 10.20.8.14 через ocbar для сети 10.20.0.0/16, домашний NAS 192.168.50.20 напрямую по локальной сети. macOS выбирает маршрут по адресу назначения, а не по приложению. Схема предполагает отсутствие конфликтов маршрутов и DNS.</desc>
<defs><filter id="shadow" x="-15%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#273543" flood-opacity=".09"/></filter><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#cbd5d2"/></pattern><marker id="purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#7863bb" stroke-width="1.5"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#238367" stroke-width="1.5"/></marker><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#507695" stroke-width="1.5"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#243830}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#74827c}.label{font-size:16px}.small{font-size:13px}.title{font-size:24px;font-weight:650}</style></defs>
<rect width="1400" height="830" rx="30" fill="#f3f6f1"/><rect x="22" y="22" width="1356" height="786" rx="20" fill="url(#dots)"/>
<text x="55" y="64" class="small muted" letter-spacing="2">ПУТЕВОЙ ЖУРНАЛ / 01</text><text x="55" y="106" font-size="30" font-weight="650">Три запроса. Каждый — своей дорогой.</text><rect x="1159" y="41" width="184" height="34" rx="17" fill="#fff" stroke="#dde4dc"/><text x="1251" y="63" text-anchor="middle" class="small muted">Пример, демо-данные</text>
<text x="55" y="152" class="small muted" letter-spacing="1">ОКНА НА ОДНОМ MAC</text><text x="585" y="152" class="small muted" letter-spacing="1">АДРЕС → МАРШРУТ</text><text x="1030" y="152" class="small muted" letter-spacing="1">ПОДКЛЮЧЕНИЕ</text>
<!-- Three familiar macOS windows: illustrative, not product screenshots -->
<g filter="url(#shadow)"><rect x="55" y="180" width="437" height="163" rx="13" fill="#fff" stroke="#d3dcd3"/><path d="M68 180h411q13 0 13 13v34H55v-34q0-13 13-13" fill="#f0f1ef"/><circle cx="74" cy="204" r="5" fill="#ee7168"/><circle cx="91" cy="204" r="5" fill="#e7bf5d"/><circle cx="108" cy="204" r="5" fill="#76b57c"/><rect x="138" y="191" width="275" height="24" rx="6" fill="#fff"/><text x="275" y="208" text-anchor="middle" class="small muted">youtube.com</text><rect x="78" y="247" width="109" height="72" rx="7" fill="#e5ddf3"/><path d="m122 267 22 16-22 15z" fill="#7863bb"/><text x="206" y="270" font-size="22" font-weight="650">YouTube</text><text x="206" y="297" class="label muted">Видео после работы</text></g>
<g filter="url(#shadow)"><rect x="55" y="388" width="437" height="163" rx="13" fill="#fff" stroke="#d3dcd3"/><path d="M68 388h411q13 0 13 13v34H55v-34q0-13 13-13" fill="#f0f1ef"/><circle cx="74" cy="412" r="5" fill="#ee7168"/><circle cx="91" cy="412" r="5" fill="#e7bf5d"/><circle cx="108" cy="412" r="5" fill="#76b57c"/><rect x="138" y="399" width="310" height="24" rx="6" fill="#fff"/><text x="293" y="416" text-anchor="middle" class="small muted">portal.example.com</text><rect x="78" y="454" width="60" height="72" rx="7" fill="#ddefe6"/><path d="M96 510v-35h24v35m-16-29v5m9-5v5m-9 7v5m9-5v5" fill="none" stroke="#238367" stroke-width="3"/><text x="156" y="477" font-size="22" font-weight="650">Рабочий портал</text><text x="156" y="503" class="label muted">Задачи, документы, команда</text><rect x="382" y="473" width="78" height="26" rx="7" fill="#e8f4ec"/><text x="421" y="491" text-anchor="middle" class="small" fill="#238367">Онлайн</text></g>
<g filter="url(#shadow)"><rect x="55" y="596" width="437" height="163" rx="13" fill="#fff" stroke="#d3dcd3"/><path d="M68 596h411q13 0 13 13v34H55v-34q0-13 13-13" fill="#f0f1ef"/><circle cx="74" cy="620" r="5" fill="#ee7168"/><circle cx="91" cy="620" r="5" fill="#e7bf5d"/><circle cx="108" cy="620" r="5" fill="#76b57c"/><text x="279" y="625" text-anchor="middle" class="label">Finder — Домашний NAS</text><rect x="56" y="643" width="111" height="103" fill="#f4f5f3"/><text x="74" y="668" class="small muted">Избранное</text><rect x="68" y="682" width="84" height="25" rx="5" fill="#dce8f1"/><text x="81" y="699" class="small">Дом</text><path d="M198 667h30l8 9h41v49h-79zM301 667h30l8 9h41v49h-79z" fill="#8dbadd"/><path d="M198 678h79M301 678h79" stroke="#739fc4" stroke-width="2"/><text x="237" y="745" text-anchor="middle" class="small muted">Фото</text><text x="340" y="745" text-anchor="middle" class="small muted">Архив</text></g>
<!-- Routing by destination networks, never process binding -->
<rect x="573" y="184" width="376" height="575" rx="20" fill="#fff" fill-opacity=".74" stroke="#d9e3d8" stroke-dasharray="4 5"/>
<text x="597" y="216" class="label" font-weight="600">macOS / таблица маршрутов</text><text x="597" y="240" class="small muted">Решение по адресу назначения</text>
<path d="M492 287H1021" stroke="#7863bb" stroke-width="3" marker-end="url(#purple)"/>
<path d="M492 495H1021" stroke="#238367" stroke-width="3" marker-end="url(#green)"/>
<path d="M492 703H1021" stroke="#507695" stroke-width="3" marker-end="url(#blue)"/>
<g><circle cx="614" cy="287" r="8" fill="#7863bb"/><circle cx="614" cy="495" r="8" fill="#238367"/><circle cx="614" cy="703" r="8" fill="#507695"/></g>
<rect x="674" y="267" width="222" height="40" rx="20" fill="#f1ecf9" stroke="#c9bddf"/><text x="785" y="292" text-anchor="middle" class="label" fill="#7863bb">Внешний адрес</text><text x="679" y="332" class="small muted">Маршрут личного VPN</text>
<rect x="674" y="475" width="222" height="40" rx="20" fill="#e6f2e9" stroke="#b2d0be"/><text x="785" y="500" text-anchor="middle" class="label mono">10.20.8.14</text><text x="679" y="541" class="small mono muted">В сети 10.20.0.0/16</text>
<rect x="674" y="683" width="222" height="40" rx="20" fill="#e8eff4" stroke="#baccd9"/><text x="785" y="708" text-anchor="middle" class="label mono">192.168.50.20</text><text x="679" y="749" class="small muted">Адрес в домашней LAN</text>
<!-- Connection endpoints -->
<rect x="1032" y="245" width="312" height="105" rx="16" fill="#fff" stroke="#d2c8e6"/><rect x="1053" y="266" width="45" height="45" rx="12" fill="#f1ecf9"/><path d="m1065 285 10-8 11 8m-21 8 10-8 11 8" fill="none" stroke="#7863bb" stroke-width="2.5"/><text x="1116" y="285" class="title">Личный VPN</text><text x="1116" y="312" class="small muted">Настроен отдельно → YouTube</text>
<rect x="1032" y="453" width="312" height="105" rx="16" fill="#fff" stroke="#a8cdb7"/><rect x="1053" y="474" width="45" height="45" rx="12" fill="#e6f2e9"/><path d="M1065 506v-20h20m-12 14 12-14m-12 0h12v12" fill="none" stroke="#238367" stroke-width="2.5"/><text x="1116" y="493" class="title">ocbar</text><text x="1116" y="520" class="small muted">Рабочий туннель → портал</text>
<rect x="1032" y="661" width="312" height="105" rx="16" fill="#fff" stroke="#bdcfdb"/><rect x="1053" y="682" width="45" height="45" rx="12" fill="#e8eff4"/><rect x="1066" y="692" width="20" height="24" rx="3" fill="none" stroke="#507695" stroke-width="2"/><path d="M1070 698h12m-12 6h12" stroke="#507695" stroke-width="2"/><circle cx="1080" cy="711" r="1.5" fill="#507695"/><text x="1116" y="701" class="title">Напрямую</text><text x="1116" y="728" class="small muted">Локальная сеть → домашний NAS</text>
<text x="55" y="802" class="small muted">Одна собственная сессия ocbar. Другой VPN — сторонний. Без конфликтов маршрутов и DNS.</text>
</svg>
