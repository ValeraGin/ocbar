<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc"><title id="title">Сначала найти имя. Потом передать данные.</title><desc id="desc">Пунктир — DNS: portal.example.com к корпоративному DNS и ответ 10.20.8.14, внешний домен к обычному резолверу. Сплошная линия — трафик с Mac через ocbar к рабочему адресу. Split DNS выбирает резолвер, маршруты выбирают путь трафика.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m1 1 5 2.5-5 2.5" fill="none" stroke="#ad8060" stroke-width="1.3"/></marker><marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m1 1 5 2.5-5 2.5" fill="none" stroke="#238367" stroke-width="1.3"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#283b31}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.s{font-size:14px;fill:#748075}.l{font-size:18px}.b{font-size:22px;font-weight:650}</style></defs><rect width="1100" height="450" rx="22" fill="#fbf8f0"/>
<rect x="45" y="116" width="242" height="250" rx="15" fill="#fff" stroke="#deded1"/><rect x="45" y="116" width="242" height="40" rx="15" fill="#f0efea"/><circle cx="65" cy="137" r="4" fill="#e87d6d"/><circle cx="80" cy="137" r="4" fill="#dbb455"/><circle cx="95" cy="137" r="4" fill="#7ead77"/><text x="69" y="200" class="b">Запрос с Mac</text><text x="69" y="235" class="m" font-size="14">portal.example.com</text><text x="69" y="320" class="m" font-size="14">external.example</text><text x="47" y="70" class="s" letter-spacing="1">ПОИСК ИМЕНИ / SPLIT DNS</text>
