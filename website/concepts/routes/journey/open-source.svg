<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Видно, что происходит внутри.</title><desc id="desc">У непрозрачного блока виден только вход и выход. В открытом коде ocbar видны компоненты: приложение, OpenConnect, маршруты, DNS и журналы. MIT, исходный код доступен на GitHub.</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#dff0e3}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.s{font-size:15px;fill:#96b4a2}.l{font-size:19px}.b{font-size:24px;font-weight:650}</style></defs><rect width="1000" height="420" rx="20" fill="#203c2f"/><text x="42" y="54" class="s" letter-spacing="2">OPEN SOURCE / MIT</text>
<rect x="55" y="102" width="310" height="233" rx="16" fill="#2b4538" stroke="#486153"/><text x="83" y="144" class="l">Непрозрачный блок</text><path d="M32 221h47m-10-7 10 7-10 7M342 221h47m-10-7 10 7-10 7" stroke="#83a591" stroke-width="2" fill="none"/><text x="210" y="238" font-size="72" text-anchor="middle" fill="#789384">?</text><text x="83" y="311" class="s">Вход → результат</text>
<rect x="443" y="84" width="509" height="268" rx="16" fill="#294938" stroke="#7caa8b"/><circle cx="466" cy="107" r="4" fill="#a0c5a8"/><circle cx="481" cy="107" r="4" fill="#a0c5a8"/><circle cx="496" cy="107" r="4" fill="#a0c5a8"/><text x="539" y="113" class="s m">ocbar / исходный код</text><path d="M444 128h507" stroke="#486b56"/><text x="472" y="170" class="b">Можно заглянуть внутрь.</text><text x="475" y="210" class="m l">app</text><text x="475" y="245" class="m l">openconnect</text><text x="705" y="210" class="m l">routes</text><text x="705" y="245" class="m l">dns</text><text x="705" y="280" class="m l">logs</text><path d="M472 307h412" stroke="#527c60"/><text x="475" y="332" class="s">Проверить. Разобраться. Предложить правку.</text><text x="55" y="389" class="s">Открытость — про наблюдаемость и возможность менять код.</text></svg>
