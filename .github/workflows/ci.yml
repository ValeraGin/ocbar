name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Раз в неделю — на второй поддерживаемой системе тоже.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Дёшево и быстро: синтаксис, shellcheck, ссылки. Минуты Linux в приватном
  # репозитории считаются один к одному, macOS — один к десяти.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: |
          for f in install.sh bin/ocmac libexec/ocmac-helper libexec/ocmac-selftest.sh tools/helper-selftest.sh tools/release.sh tools/helper-version-check.sh swiftbar/ocmac.5s.sh app/make-app.sh tools/server-lab/*.sh; do
            bash -n "$f"
          done
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S error install.sh bin/ocmac libexec/ocmac-helper libexec/ocmac-selftest.sh tools/helper-selftest.sh tools/release.sh tools/helper-version-check.sh swiftbar/ocmac.5s.sh app/make-app.sh
          shellcheck -S error tools/server-lab/*.sh
          python3 -m compileall -q libexec/*.py tools/*test.py tools/server-lab/*.py
      - name: Перевод интерфейса
        run: python3 tools/i18n-scan.py --check
      - name: Live runner environment isolation (no network)
        run: |
          python3 tools/macos-vpn-test-selftest.py
          python3 tools/macos-path-test-selftest.py
          python3 tools/migration-selftest.py
          python3 tools/installer-selftest.py
          python3 tools/embedded-csd-selftest.py
          python3 tools/profile-workflow-selftest.py
      - name: Formula syntax
        run: ruby -c Formula/openconnect-for-mac.rb
      - name: Markdown links
        run: python3 tools/check-links.py

  ocserv:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v5
      - name: Install real OpenConnect client
        run: sudo apt-get update -qq && sudo apt-get install -y openconnect
      - name: Build isolated ocserv
        run: docker build --build-arg BASE=debian:${{ matrix.debian }}-slim -t ocmac-test-ocserv:${{ matrix.debian }} tools/server-lab
      - name: Authentication and isolated tunnel against real ocserv
        run: python3 tools/ocserv-integration-test.py --image ocmac-test-ocserv:${{ matrix.debian }}

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'schedule' && fromJSON('["macos-26", "macos-15"]') || fromJSON('["macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Build ocmac-auth
        run: swift build -c release --package-path auth

      - name: ocmac-auth self-test
        run: auth/.build/release/ocmac-auth --selftest

      - name: HostScan wrapper sequence (local HTTPS gateway)
        run: python3 tools/hostscan-sequence-test.py

      - name: AnyConnect gateway matrix (local HTTPS, real WebKit)
        run: python3 tools/gateway-matrix-test.py
      - name: Explicit upstream proxy (URLSession and WebKit)
        run: python3 tools/upstream-proxy-test.py

      - name: ocmac-auth learn self-test (WebKit, offscreen)
        run: auth/.build/release/ocmac-auth --learn-selftest

      - name: Helper self-test (dry-run, stubs)
        run: tools/helper-selftest.sh

      - name: CLI self-test
        env:
          OCMAC_AUTH: ${{ github.workspace }}/auth/.build/release/ocmac-auth
        run: bin/ocmac selftest

      - name: CLI and auth self-tests in the brew test sandbox
        env:
          OCMAC_AUTH: ${{ github.workspace }}/auth/.build/release/ocmac-auth
        run: |
          t=$(mktemp -d /private/tmp/ocmac-brewsb.XXXXXX)
          TMPDIR="$t" sandbox-exec -f tools/brew-sandbox.sb bin/ocmac selftest
          TMPDIR="$t" sandbox-exec -f tools/brew-sandbox.sb auth/.build/release/ocmac-auth --selftest

      - name: Build app bundle
        run: app/make-app.sh

      - name: App self-test
        run: app/.build/ocmac.app/Contents/MacOS/ocmac-app --selftest
