name: Feature request
description: Suggest a change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the "Deliberate no" list in CONTRIBUTING.md first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where it got in the way
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is for a single user on their own Mac, not a managed fleet
