<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ocbar — песочница интерфейса</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f3ef; --card: #fff; --line: #e2e0d8; --line2: #cfcdc4;
    --tx: #1c1c1a; --tx2: #5f5e5a; --tx3: #8a8880;
    --ok: #1d7a52; --okbg: #e4f3ec; --warn: #a56a0b; --warnbg: #faf0dc;
    --bad: #b3352f; --badbg: #fbeae9; --acc: #2f6bbf; --accbg: #e8f0fa;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  [data-theme="dark"] {
    --bg: #17171a; --card: #202024; --line: #303036; --line2: #45454d;
    --tx: #ecebe6; --tx2: #a5a39c; --tx3: #74736d;
    --ok: #5dcaa5; --okbg: #12291f; --warn: #efb14a; --warnbg: #2a2113;
    --bad: #ea7a72; --badbg: #2c1614; --acc: #7fb0ee; --accbg: #14202e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.5 var(--sans); }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 15px; font-weight: 500; margin: 0 12px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--tx2); font: inherit;
                padding: 5px 11px; cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--acc); color: #fff; }
  label.lbl { color: var(--tx2); font-size: 12px; }
  main { padding: 22px 20px 60px; display: flex; gap: 26px; align-items: flex-start; flex-wrap: wrap; }
  .stage { display: flex; flex-direction: column; gap: 8px; }
  .stage h2 { font-size: 12px; font-weight: 400; color: var(--tx3); margin: 0; }
  .menu { width: 320px; background: var(--card); border: 1px solid var(--line);
          border-radius: 11px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .hd { padding: 11px 13px 10px; }
  .ttl { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .nm { font-size: 13px; font-weight: 500; }
  .tm { margin-left: auto; font: 11.5px var(--mono); color: var(--tx2); }
  .note { font-size: 11.5px; color: var(--tx2); margin-top: 6px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 13px; font-size: 13px; }
  .row.act { color: var(--tx); cursor: default; }
  .row.mut { color: var(--tx2); }
  .sep { height: 1px; background: var(--line); margin: 5px 0; }
  .kv { display: flex; font-size: 12px; padding: 3px 13px; }
  .kv b { font-weight: 400; color: var(--tx2); }
  .kv span { margin-left: auto; font: 11.5px var(--mono); }
  .m { font: 11.5px var(--mono); }
  .rt { display: flex; align-items: center; gap: 8px; padding: 5px 13px; font: 11.5px var(--mono); }
  .tog { width: 26px; height: 15px; border-radius: 20px; margin-left: auto; position: relative; background: var(--line2); }
  .tog.on { background: var(--ok); }
  .tog i { position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; }
  .tog.on i { left: auto; right: 2px; }
  .sub { font-size: 11px; color: var(--tx2); }
  .ttl .sw { margin-left: auto; }
  .sw { width: 30px; height: 17px; border-radius: 20px; position: relative; background: var(--line2); flex: none; }
  .sw.on { background: var(--ok); }
  .sw i { position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
  .sw.on i { left: auto; right: 2px; }
  .row .r { margin-left: auto; font-size: 12px; color: var(--tx3); }
  .row .r.m { font: 11.5px var(--mono); }
  .banner { display: flex; gap: 6px; align-items: center; margin: 8px 0 0; padding: 5px 8px; border-radius: 6px;
            background: var(--warnbg); color: var(--warn); font-size: 11.5px; }
  .banner u { margin-left: auto; cursor: default; }
  .pl { padding: 4px 13px 4px 30px; font-size: 12px; position: relative; }
  .pl small { display: block; font-size: 10.5px; color: var(--tx3); }
  .pl .ck { position: absolute; left: 13px; top: 4px; }
  svg.spark { width: 100%; height: 42px; display: block; margin: 8px 0 2px; }
  .legend { display: flex; gap: 10px; font-size: 11px; color: var(--tx3); }
  .legend span:last-child { margin-left: auto; }
  .src { margin: 0 20px 30px; font-size: 12px; color: var(--tx3); }
  .src code { font: 11.5px var(--mono); background: var(--card); border: 1px solid var(--line);
              border-radius: 5px; padding: 1px 5px; }
</style>
</head>
<body>
<header>
  <h1>ocbar — песочница интерфейса</h1>
  <label class="lbl">состояние</label>
  <div class="seg" id="states"></div>
  <label class="lbl">тема</label>
  <div class="seg" id="themes">
    <button data-t="light" aria-pressed="true">светлая</button>
    <button data-t="dark" aria-pressed="false">тёмная</button>
  </div>
  <label class="lbl"><input type="checkbox" id="live" checked> живой график</label>
  <label class="lbl"><input type="checkbox" id="nonotify"> уведомления выключены</label>
  <span class="lbl" id="dataSrc" style="margin-left:auto"></span>
</header>

<main id="stages"></main>

<p class="src">Данные берутся из <code>state.json</code> рядом с этим файлом, если он есть —
его кладёт <code>ocbar ui-lab --live</code>. Иначе показывается набор-образец.</p>

<script>
const DEMO = {
  profile: "Основной", tundev: "utun8", ip: "10.20.30.40", gateway: "198.51.100.7",
  mtu: 1294, dns: "192.0.2.10 +1", since: "2ч 14м", rx: "7,2 ГБ", tx: "155 МБ",
  latency: "41 мс", health: "wiki отвечает",
  routes: [["10.0.0.0/8", true], ["172.16.0.0/12", true], ["11.0.0.0/8", false]],
  zones: 6, zonesOn: 5,
  profiles: [["Основной", "Любые устройства"], ["Из офиса", "Изнутри сети"], ["Прокси", "SOCKS 127.0.0.1:11080"]]
};
let D = DEMO;

// Как в приложении: в шапке всегда профиль, под ним состояние и время,
// справа выключатель; график — только там, где есть трафик.
const STATES = {
  connected: { label: "подключено", dot: "var(--ok)", sub: "Подключено", time: true, spark: true, sw: true,
               rows: ["Приостановить|⌥⌘P"] },
  paused:    { label: "пауза", dot: "var(--warn)", sub: "На паузе", time: true, spark: false, sw: true,
               note: "Маршруты и зоны сняты, туннель и сессия живы — возврат без входа.",
               rows: ["*Возобновить|⌥⌘P"] },
  lost:      { label: "связь пропала", dot: "var(--warn)", sub: "Нет связи", time: true, spark: true, sw: true,
               note: "Связи нет 18 с. openconnect восстанавливает сессию сам — вход не потребуется.",
               rows: ["Приостановить|⌥⌘P"] },
  starting:  { label: "подключается", dot: "var(--warn)", sub: "Подключается…", spark: false, sw: true,
               rows: ["Отменить подключение"] },
  needlogin: { label: "нужен вход", dot: "var(--bad)", sub: "Нужен вход", spark: false, sw: false,
               note: "Сессия истекла, молча войти не удалось. Автоподключение остановлено — решение за вами.",
               rows: ["*Войти", "Войти и запомнить вход…", "Не подключаться"] },
  off:       { label: "отключено", dot: "var(--line2)", sub: "Отключён", spark: false, sw: false,
               rows: ["Подключить и запомнить вход…"] }
};
let state = "connected";

function spark(seed, active) {
  const n = 34, pts = [], pts2 = [];
  for (let i = 0; i < n; i++) {
    const v = active ? 8 + Math.abs(Math.sin(seed + i * 0.55)) * 26 : 2;
    pts.push(`${(i / (n - 1) * 300).toFixed(1)},${(40 - v).toFixed(1)}`);
    pts2.push(`${(i / (n - 1) * 300).toFixed(1)},${(40 - v * 0.28).toFixed(1)}`);
  }
  return `<svg class="spark" viewBox="0 0 300 42" role="img" aria-label="Трафик за минуту">
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--acc)" stroke-width="1.5"/>
    <polyline points="${pts2.join(' ')}" fill="none" stroke="var(--tx3)" stroke-width="1"/></svg>`;
}

function head(st, d, seed, active) {
  const noNotify = document.getElementById("nonotify").checked;
  return `<div class="hd">
    <div class="ttl"><span class="dot" style="background:${st.dot}"></span>
      <div><div class="nm">${d.profile}</div>
      <div class="sub">${st.sub}${st.time ? " · " + d.since : ""}</div></div>
      <span class="sw ${st.sw ? "on" : ""}" title="${st.sw ? "Отключить" : "Подключить"}"><i></i></span></div>
    ${st.note ? `<div class="note">${st.note}</div>` : ""}
    ${noNotify ? `<div class="banner">Уведомления выключены<u>Разрешить</u></div>` : ""}
    ${st.spark ? spark(seed, active) +
      `<div class="legend"><span>↓ 1,2 МБ/с</span><span>↑ 84 КБ/с</span><span>за минуту</span></div>` : ""}
    </div>`;
}

function row(text) {
  const [t, r] = text.split("|"), act = t.startsWith("*");
  return `<div class="row ${act ? "act" : "mut"}"${act ? ' style="font-weight:500"' : ""}>${act ? t.slice(1) : t}${r ? `<span class="r m">${r}</span>` : ""}</div>`;
}

function netsCount(d) {
  return `${d.routes.filter(r => r[1]).length}/${d.routes.length} · ${d.zonesOn ?? d.zones}/${d.zones}`;
}

function tail() {
  return `<div class="sep"></div>${row("Настройки…|⌘,")}${row("Диагностика и журналы…")}${row("Выйти|⌘Q")}`;
}

function menuCompact(s, seed) {
  const st = STATES[s], d = D, up = ["connected", "paused", "lost"].includes(s);
  return `<div class="menu">${head(st, d, seed, s === "connected")}<div class="sep"></div>
    ${st.rows.map(row).join("")}
    <div class="row mut">Профиль<span class="r">${d.profile} ›</span></div>
    ${up ? `<div class="sep"></div><div class="row mut">Сети и DNS<span class="r m">${netsCount(d)} ⌄</span></div>` : ""}
    ${tail()}</div>`;
}

function menuDetails(seed) {
  const d = D;
  return `<div class="menu">${head(STATES.connected, d, seed, true)}<div class="sep"></div>
    ${row("Приостановить|⌥⌘P")}
    <div class="row mut">Профиль<span class="r">${d.profile} ›</span></div>
    <div class="sep"></div>
    <div class="row mut">Сети и DNS<span class="r m">${netsCount(d)} ⌃</span></div>
    <div style="padding:0 0 6px">
      <div class="kv"><b>Адрес в туннеле</b><span>${d.ip}</span></div>
      <div class="kv"><b>Шлюз</b><span>${d.gateway}</span></div>
      <div class="kv"><b>MTU</b><span>${d.mtu}</span></div>
      <div class="kv"><b>Резолверы</b><span>${d.dns}</span></div>
      <div class="kv"><b>Принято / отдано</b><span>${d.rx} / ${d.tx}</span></div>
      <div class="kv"><b>Задержка</b><span>${d.latency}</span></div>
    </div><div class="sep"></div>
    <div class="row mut" style="font-size:12px">Сети в туннеле
      <span class="r m">${d.routes.filter(r=>r[1]).length} из ${d.routes.length}</span></div>
    ${d.routes.map(([n, on]) => `<div class="rt"><span style="color:${on ? "var(--tx)" : "var(--tx3)"}">${n}</span>
      <span class="tog ${on ? "on" : ""}"><i></i></span></div>`).join("")}
    <div class="sep"></div>
    <div class="row mut" style="font-size:12px">Зоны DNS<span class="r m">${d.zonesOn ?? d.zones} из ${d.zones}</span></div>
    ${tail()}</div>`;
}

// Список профилей раскрыт: порядок тот, что расставлен перетаскиванием в
// окне профиля (profiles.order).
function menuProfiles(seed) {
  const d = D, list = d.profiles || DEMO.profiles;
  return `<div class="menu">${head(STATES.connected, d, seed, true)}<div class="sep"></div>
    ${row("Приостановить|⌥⌘P")}
    <div class="row mut">Профиль<span class="r">${d.profile} ⌄</span></div>
    ${list.map(([n, ds]) => `<div class="pl">${n === d.profile ? '<span class="ck">✓</span>' : ""}${n}<small>${ds}</small></div>`).join("")}
    <div class="sep"></div><div class="row mut">Сети и DNS<span class="r m">${netsCount(d)} ⌄</span></div>
    ${tail()}</div>`;
}

function render() {
  const seed = Date.now() / 900;
  document.getElementById("stages").innerHTML =
    `<div class="stage"><h2>меню — свёрнуто</h2>${menuCompact(state, seed)}</div>` +
    `<div class="stage"><h2>меню — сети и DNS</h2>${menuDetails(seed)}</div>` +
    `<div class="stage"><h2>меню — профили</h2>${menuProfiles(seed)}</div>` +
    `<div class="stage"><h2>все состояния подряд</h2>` +
      Object.keys(STATES).map((s, i) => menuCompact(s, seed + i)).join("") + `</div>`;
}

const segStates = document.getElementById("states");
segStates.innerHTML = Object.entries(STATES)
  .map(([k, v]) => `<button data-s="${k}" aria-pressed="${k === state}">${v.label}</button>`).join("");
segStates.onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  state = b.dataset.s;
  [...segStates.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
};
document.getElementById("themes").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.documentElement.dataset.theme = b.dataset.t;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
};
let timer = setInterval(() => { if (document.getElementById("live").checked) render(); }, 900);
document.getElementById("nonotify").onchange = render;

fetch("state.json").then(r => r.ok ? r.json() : null).then(j => {
  if (!j) throw 0;
  D = Object.assign({}, DEMO, j);
  document.getElementById("dataSrc").textContent = "данные: живые, из state.json";
  render();
}).catch(() => {
  document.getElementById("dataSrc").textContent = "данные: образец";
});
render();
</script>
</body>
</html>
